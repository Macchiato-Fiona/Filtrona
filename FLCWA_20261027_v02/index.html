<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--BUILD:HEAD-START-->
<title>FLC 2027 Shanghai</title>
<!--BUILD:HEAD-END-->
<meta name="description" content="Filtrona Leadership Conference 2027 · Shanghai · 19–21 January 2027 — agenda, people, venue and city guide.">
<meta name="theme-color" content="#F7FAF2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FLC 2027">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/barlow-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--BUILD:BODY-START-->
<div id="app" class="app">

  <!-- Sign in -->
  <section id="screen-login" class="screen login" hidden>
    <div class="login__top">
      <div class="login__badge"><img src="assets/img/logo.svg" alt="Filtrona" width="44" height="36"></div>
      <p class="eyebrow">19 – 21 January 2027 · Shanghai</p>
      <h1 class="login__title">Filtrona Leadership Conference</h1>
      <p class="login__theme">Driving Change, Delivering Results</p>
      <div class="login__stack" aria-hidden="true">
        <span style="background-image:url(assets/img/lujiazui.jpg)"></span><span style="background-image:url(assets/img/bund.jpg)"></span><span style="background-image:url(assets/img/yu-garden.jpg)"></span>
        <em>JW Marriott Marquis · Pudong</em>
      </div>
    </div>
    <form id="login-form" class="login__form login__sheet" novalidate autocomplete="on">
      <label class="field" for="login-name">
        <span class="field__label">Your name</span>
        <input id="login-name" name="name" type="text" autocomplete="name" autocapitalize="words" spellcheck="false" placeholder="First name Last name" required>
      </label>
      <label class="field" for="login-pass" id="login-pass-wrap" hidden>
        <span class="field__label">Admin password</span>
        <span class="field__row">
          <input id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="Admin password">
          <button type="button" class="field__toggle" id="login-show" aria-label="Show password">Show</button>
        </span>
      </label>
      <p id="login-error" class="login__error" role="alert" hidden></p>
      <button type="submit" class="btn btn--primary btn--block" id="login-go">Continue</button>
      <button type="button" id="login-guest" class="login__guest">Continue as guest</button>
    </form>
    <p class="login__foot">JW Marriott Marquis Hotel Shanghai Pudong</p>
  </section>

  <!-- First-run story -->
  <section id="screen-onboard" class="screen onboard" hidden>
    <div class="onboard__track" id="onboard-track"></div>
    <div class="onboard__bar">
      <div class="onboard__progress" id="onboard-progress" aria-hidden="true"></div>
      <div class="onboard__actions">
        <button type="button" class="btn btn--text" id="onboard-skip">Skip</button>
        <span class="onboard__count" id="onboard-count">1 of 3</span>
        <button type="button" class="btn btn--primary" id="onboard-next">Next</button>
      </div>
    </div>
  </section>

  <!-- Main app -->
  <div id="shell" class="shell" hidden>
    <header class="topbar" id="topbar"></header>
    <div id="notice-bar" class="notice-bar is-empty" aria-live="polite"></div>
    <main id="view" class="view" tabindex="-1"></main>
    <div class="edge-fade" aria-hidden="true"></div>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <!-- Bottom sheet -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close-sheet></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet__grip" aria-hidden="true"></div>
      <button type="button" class="sheet__close icon-btn" data-close-sheet aria-label="Close"></button>
      <div class="sheet__body" id="sheet-body"></div>
    </div>
  </div>

  <!-- Image viewer -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox__bar">
      <span class="lightbox__cap" id="lightbox-cap"></span>
      <button type="button" class="icon-btn" id="lightbox-close" aria-label="Close image"></button>
    </div>
    <div class="lightbox__stage" id="lightbox-stage"><img id="lightbox-img" alt=""></div>
    <p class="lightbox__hint">Tap the image to zoom · drag to move</p>
  </div>

  <!-- Taxi card -->
  <div id="taxi" class="taxi" hidden>
    <button type="button" class="icon-btn" id="taxi-close" aria-label="Close"></button>
    <p class="taxi__label">Please take me to</p>
    <p class="taxi__name" id="taxi-name"></p>
    <p class="taxi__addr" id="taxi-addr"></p>
    <p class="taxi__tel" id="taxi-tel"></p>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</div>

<!-- Content and accounts: edit these two files. Live notices, agenda edits
     and attendees are published from the Admin page into data/*.json -->
<script src="data/content.js"></script>
<script src="config/users.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
<!--BUILD:BODY-END-->
</body>
</html>
